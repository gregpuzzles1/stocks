<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Portfolio</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css?v=9"></head><body><main><nav class="tabs"><button id="tab-portfolio" class="tab active" type="button">My Portfolio</button><button id="tab-watchlist" class="tab" type="button">Watchlist</button></nav><section id="portfolio"><h1>My Portfolio</h1><p id="summary">Loading prices…</p><form id="form"><input id="symbol" placeholder="Ticker (AAPL)" required><input id="shares" type="number" min="0" step="0.000001" placeholder="Shares" required><input id="cost" type="number" min="0" step="0.01" placeholder="Cost per share" required><button>Add / update</button></form><button id="refresh">Refresh prices</button><div class="tablewrap"><table><thead><tr><th>Symbol</th><th>Shares</th><th>Cost</th><th>Price</th><th>Value</th><th>P/L</th><th></th></tr></thead><tbody></tbody></table></div><div id="info"></div><div id="pie"></div></section><section id="watchlist" hidden><h1>Watchlist</h1><p id="watch-summary">Loading prices…</p><form id="watch-form"><input id="watch-symbol" placeholder="Ticker (AAPL)" required><button>Add</button></form><button id="watch-refresh" type="button">Refresh prices</button><div class="tablewrap"><table><thead><tr><th>Symbol</th><th>Price</th><th>Change</th><th>Change %</th><th></th></tr></thead><tbody id="watch-body"></tbody></table></div><div id="watch-info"></div></section></main><script src="app.js?v=8"></script></body></html>
